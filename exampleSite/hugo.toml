# Example site for the Stage theme. Every theme setting is listed under [params.stage],
# set to its default value unless noted. See README.md for the details of each one.

baseURL = "https://example.org/"
title = "Jane Roe | Developer"
copyright = "Jane Roe"

# The theme lives two folders up when this example is run from the theme repository.
theme = "hugo-theme-stage"
themesDir = "../.."

[pagination]
  pagerSize = 10

# `series` groups multi-part posts. Declaring taxonomies replaces Hugo's defaults, so list them all.
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # the kitchen-sink post uses <kbd>; not needed by the theme
  [markup.highlight]
    noClasses = false        # required: the theme ships its own Chroma colours (css/chroma.css)
    lineNos = true
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

[params]
  mainSections = ["post"]
  rssFullContent = true

  [params.stage]
    brand = "ROE.DEV"              # header logo, 404, cards. Default: the baseURL host, else the site title
    description = "Notes on building small, sturdy software."
    since = 2021
    dateFormat = ":date_medium"    # Hugo time.Format layout, localized
    [params.stage.footer]
      text = "Example content. The opinions here belong to a fictional person."

    [params.stage.hero]
      name = ["JANE", "ROE"]        # one line per item (up to three); a string is split on spaces
      role = "INDEPENDENT DEVELOPER"
      stack = ["GO", "RUST", "POSTGRES", "WASM"]
      status = true                 # the "SYS://BRAND ONLINE" line
      stats = true                  # posts / series / tags stamps

    [params.stage.home]
      sections = ["latest", "series", "contact"]   # order and presence; add your own in layouts/_partials/home/
      [params.stage.home.latest]
        count = 5
        title = ""                  # "" = translated default ("NEW INTEL")
      [params.stage.home.series]
        title = ""
      [params.stage.home.contact]
        title = ""
        rss = true
      [params.stage.home.ticker]
        enabled = true
        items = []                  # [] = automatic stats; or your own lines

    [params.stage.article]
      toc = true
      readingTime = true
      progress = true
      externalLinksNewTab = true
      license = "Text licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)."

    [params.stage.motion]
      enabled = true

    [params.stage.search]
      enabled = true                # Pagefind; build the index after Hugo (see README)

    [params.stage.comments]
      provider = "none"             # "disqus" (uses services.disqus.shortname), "giscus" or "none"
      [params.stage.comments.giscus]
        repo = ""
        repoId = ""
        category = ""
        categoryId = ""
        mapping = "pathname"

    [params.stage.mermaid]
      enabled = true
      url = "https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs"

    [params.stage.og]
      cards = true
      [params.stage.og.twitter]
        site = ""
        card = "summary_large_image"

    [params.stage.favicon]
      letter = ""                   # "" = first letter of the brand
      ico = ""
      svg = ""
      appleTouch = ""

    [params.stage.cover]
      field = "image"

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Posts"
    url = "/post/"
    weight = 2
  [[menus.main]]
    name = "Series"
    url = "/series/"
    weight = 3
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 4
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 5
  [[menus.main]]
    name = "Search"
    url = "/search/"
    weight = 6

  [[menus.social]]
    name = "GitHub"
    url = "https://github.com/"
    weight = 1
  [[menus.social]]
    name = "Mastodon"
    url = "https://mastodon.social/"
    weight = 2
  [[menus.social]]
    name = "Email"
    url = "mailto:jane@example.org"
    weight = 3
